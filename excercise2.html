<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h4>Personal Information</h4>
    <form action="" method="post">
        <label for="">User Name</label>
        <input type="text" name="uname" placeholder="Enter your name" required><br><br>
        <label for="">Age</label>
        <input type="number" name="age" min="0" max="80"><br><br>
        <label for="">Gender</label><br>
        <input type="radio" value="male">
        <label for="">Male</label>
        <input type="radio" value="female">
        <label for="">Female</label><br>
        <label for="">Hobbies</label><br>
        <input type="checkbox" value="Reading">
        <label for="">Reading</label><br>
        <input type="checkbox" value="Singing">
        <label for="">Singing</label><br>
        <input type="checkbox" value="Painting">
        <label for="">Painting</label><br>
        <label for="">Language</label>
        <select>
            <option value="Malayalam">Malayalam</option>
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
        </select>
        <input type="button" value="Save">





    </form>
</body>

</html>
